name: Publish visual prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Copy replaceable media
        run: |
          mkdir -p docs/assets
          cp public/images/insignia-ricardo-palma.png docs/assets/insignia.png
          cp public/images/opcion-1.png docs/assets/opcion-1.png
          cp public/images/opcion-2.png docs/assets/opcion-2.png
          cp public/videos/presentacion.mp4 docs/assets/presentacion.mp4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4